# Test-only overlay for the browser walk-through (e2e/README.md).
#
#   docker compose -p aegis-e2e --env-file e2e/.env.e2e \
#     -f docker-compose.yml -f e2e/compose.e2e.yml up -d --build
#
# docker-compose.yml is used unchanged. Containers are named aegis-e2e-* via
# CONTAINER_PREFIX (set by run.sh), so the test stack runs beside a real
# install. This file only swaps the ./data bind mounts for named volumes, so
# the test never touches a real ./data directory and `down -v` removes
# everything it created.
services:
  aegis:
    volumes:
      - secrets:/app/data/secrets
  db:
    volumes:
      - postgres:/var/lib/postgresql/data
  redis:
    volumes:
      - redis:/data
  minio:
    volumes:
      - minio:/data

volumes:
  secrets:
  postgres:
  redis:
  minio:
