# Test-only overlay for the browser walk-through (e2e/README.md).
#
#   docker compose -p aegis-e2e -f docker-compose.yml -f e2e/compose.e2e.yml up -d --build
#
# docker-compose.yml is used unchanged; this file only
#   - renames containers, so the test stack can run beside a real Aegis install
#     on the same Docker host (the base file pins container_name), and
#   - swaps the ./data bind mounts for named volumes, so the test never touches
#     a real ./data directory and `down -v` removes everything it created.
services:
  nginx:
    container_name: aegis-e2e-nginx
  aegis:
    container_name: aegis-e2e-app
    volumes:
      - secrets:/app/data/secrets
  db:
    container_name: aegis-e2e-db
    volumes:
      - postgres:/var/lib/postgresql/data
  redis:
    container_name: aegis-e2e-redis
    volumes:
      - redis:/data
  minio:
    container_name: aegis-e2e-minio
    volumes:
      - minio:/data
  minio-init:
    container_name: aegis-e2e-minio-init
  docling:
    container_name: aegis-e2e-docling

volumes:
  secrets:
  postgres:
  redis:
  minio:
