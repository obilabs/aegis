# Aegis Client - Docker Compose (single file for dev + prod)
#
# QUICK START:
#   1. cp env.example .env  (then edit values)
#   2. docker compose up -d          (pulls pre-built image)
#      OR: docker compose up -d --build  (builds from source)
#   3. Open http://localhost:8080
#
# Architecture:
#   nginx:8080 → nextjs:3000 (internal) → postgres:5432 (internal)
#   Only nginx port is exposed to the host.
#
# Prod-flexibility knobs (set in .env, defaults keep dev working):
#   BIND_HOST           = interface to bind nginx to (default 0.0.0.0)
#                         Set to a LAN IP like 172.25.10.20 for multi-host
#                         hosts where 0.0.0.0 would conflict.
#   PORT                = host port for nginx (default 8080)
#   AEGIS_VERSION       = image tag from ghcr.io (default 0.1.0)
#
# Storage: bind mounts in ./data/ per root CLAUDE.md rule ("Volumes stored
# in ./data/ within the project folder — never shared named volumes").
# ./data/postgres, ./data/redis, ./data/minio persist across container
# recreation. `docker compose down` won't delete them; `rm -rf ./data`
# is the only true wipe.
#
# Docling (document processing) is behind a compose profile — start it
# with `docker compose --profile docling up -d` when you want PDF/DOCX
# ingest. Default `up` skips it (saves the ~2GB image pull).

services:
  # Nginx reverse proxy (ONLY exposed service)
  nginx:
    image: nginx:alpine
    container_name: aegis-nginx
    ports:
      - "${BIND_HOST:-0.0.0.0}:${PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      aegis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - aegis

  # Next.js application (internal only — no ports exposed to host)
  # "docker compose up" pulls the pre-built image.
  # "docker compose up --build" builds from source instead.
  aegis:
    image: ghcr.io/obilabs/aegis:${AEGIS_VERSION:-0.1.0}
    build:
      # Standalone repo: @obilabs/* install from GitHub Packages via the
      # npm_token BuildKit secret. Build with NPM_TOKEN=$(gh auth token).
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:8080}
      secrets:
        - npm_token
    container_name: aegis
    expose:
      - "3000"
    environment:
      - DATABASE_URL=postgresql://aegis:${POSTGRES_PASSWORD:-aegis}@db:5432/aegis
      # Leave BETTER_AUTH_SECRET unset to have one auto-generated + persisted to
      # ./data/secrets/ on first boot (spec: zero-config-secret-bootstrap). An
      # empty default (not a "change-me" sentinel) is required so the bootstrap
      # actually triggers — a hardcoded default would suppress it and leave every
      # deploy sharing one guessable secret.
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:8080}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:8080}
      # Admin seed — leave ADMIN_PASSWORD empty to force operator to
      # create the admin via /portal/setup on first browser visit
      # (recommended). Set ADMIN_PASSWORD for headless CI/CD deploys.
      # See scripts/seed-admin.mjs + env.example for the two-mode flow.
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@aegis.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_NAME=${ADMIN_NAME:-Aegis Administrator}
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin123}
      - S3_BUCKET=${S3_BUCKET:-aegis-uploads}
      - S3_REGION=${S3_REGION:-us-east-1}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-50}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@aegis.local}
      - DOCLING_URL=${DOCLING_URL:-http://docling:5001}
      # HMAC + AES-GCM key for email envelope encryption + Message-ID
      # signing (auth-foundations + email-ingest Phase 1). NOTE: the
      # credential vault does NOT use this key — it has its own
      # CREDENTIAL_ENCRYPTION_KEY below. Dev fallback path; prod should
      # use AEGIS_SECRETS_KEY_FILE pointing at a Docker secret.
      # Generate with: openssl rand -hex 32
      - AEGIS_SECRETS_KEY=${AEGIS_SECRETS_KEY:-}
      # AES-256-GCM key for the CREDENTIAL VAULT (lib/encryption.ts). This is
      # a SEPARATE key from AEGIS_SECRETS_KEY (which the email paths use).
      # Without it every credential create/reveal returns 500. Generate with:
      # openssl rand -hex 32   (32 bytes -> 64 hex chars)
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:-}
      # Where auto-generated master keys are persisted when the env vars above
      # are omitted (spec: zero-config-secret-bootstrap). Bind-mounted below so
      # keys survive container recreation + image upgrades. BACK THIS UP.
      - AEGIS_SECRETS_DIR=${AEGIS_SECRETS_DIR:-/app/data/secrets}
      # Telemetry master kill-switch (PRINCIPLES.md #2). Leave unset for
      # default-on (with in-app consent flow); set to "false" to hard-
      # disable all outbound telemetry regardless of DB setting.
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    # Durable store for auto-generated master keys (secret-bootstrap). Bind mount
    # in ./data/ per the CLAUDE.md volume rule; MUST be backed up with the data.
    volumes:
      - ./data/secrets:/app/data/secrets
    restart: unless-stopped
    networks:
      - aegis

  # PostgreSQL database with pgvector (internal only)
  db:
    image: pgvector/pgvector:pg16
    container_name: aegis-db
    expose:
      - "5432"
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis}
      POSTGRES_DB: aegis
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - aegis

  # Redis (internal only — for pg-boss job queue + caching)
  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    expose:
      - "6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aegis

  # MinIO object storage (internal only — for file uploads)
  minio:
    image: minio/minio:latest
    container_name: aegis-minio
    command: server /data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - aegis

  # Auto-create default bucket on startup
  minio-init:
    image: minio/mc:latest
    container_name: aegis-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set aegis http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb --ignore-existing aegis/${S3_BUCKET:-aegis-uploads};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    networks:
      - aegis

  # Document Processing (opt-in via profile — the image is ~2GB and
  # only needed for PDF/DOCX/PPTX ingest into KB articles).
  #
  # Enable with: docker compose --profile docling up -d
  # Without it, document upload is disabled (manual KB authoring still
  # works). CPU-only; no GPU required.
  docling:
    profiles: [docling, full]
    image: quay.io/docling-project/docling-serve
    container_name: aegis-docling
    expose:
      - "5001"
    environment:
      - DOCLING_BACKEND=pypdfium2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - aegis

networks:
  aegis:
    driver: bridge

secrets:
  # GitHub Packages auth for @obilabs/* installs, read from host NPM_TOKEN.
  npm_token:
    environment: NPM_TOKEN
