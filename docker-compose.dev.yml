# Aegis Web - Development Docker Compose
#
# Port Strategy (avoids conflicts with other services):
#   - HTTP:  8080 (nginx proxy to local dev server)
#   - DB:    5433 (exposed for local npm run dev)
#   - App:   3000 (local, run with npm run dev:network)
#
# Usage:
#   1. Start nginx + db:
#      docker compose -f docker-compose.dev.yml up -d
#
#   2. Run Next.js locally (with network access):
#      npm run dev:network
#
#   3. Access via nginx on port 8080:
#      http://localhost:8080  or  http://<your-ip>:8080

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: Aegis
      POSTGRES_PASSWORD: Aegis
      POSTGRES_DB: Aegis_web
    volumes:
      - Aegis-web_postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Aegis -d Aegis_web"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  Aegis-web_postgres_data:
    external: true  # Use same volume as production compose
