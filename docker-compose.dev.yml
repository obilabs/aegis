# Aegis - local development support services
#
# Runs nginx + Postgres in Docker while Next.js runs on the host with hot
# reload. Separate from docker-compose.yml (the full stack).
#
# Usage:
#   1. docker compose -f docker-compose.dev.yml up -d
#   2. In .env.local:
#        DATABASE_URL=postgresql://aegis:aegis-dev@localhost:5433/aegis
#   3. pnpm dev:network
#   4. Open http://localhost:8080 (nginx) or http://localhost:3000 (direct)
#
# Data lives in ./data/dev-postgres (bind mount; `rm -rf ./data/dev-postgres`
# is the wipe). The schema is applied from database/init.sql on first start.
# The fixed dev password is for this local-only database; ports bind to
# 127.0.0.1 so it is not reachable from the network.

services:
  nginx:
    image: nginx:1.30.4-alpine
    container_name: aegis-dev-nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aegis-dev

  db:
    image: pgvector/pgvector:pg16
    container_name: aegis-dev-db
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis-dev
      POSTGRES_DB: aegis
    volumes:
      - ./data/dev-postgres:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - aegis-dev

networks:
  aegis-dev:
    driver: bridge
