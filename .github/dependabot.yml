version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }
    # Majors are a scheduled pass, not something to chase mid-phase (Next.js and
    # React majors in particular are a deliberate upgrade, not a dependabot PR).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
