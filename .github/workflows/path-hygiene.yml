name: Path Hygiene

# Fast, build-free guards that run on every PR and push to main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-committed-credentials:
    name: No committed credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Scan tracked files for credentials
        # A CONTENT gate: .gitignore is path-based and cannot stop a password
        # hardcoded inside a committed file. Ported from obilabs-platform /
        # helios so all three repos guard this the same way.
        run: node scripts/check-no-secrets.mjs
