name: Build Aegis

# Ported from the pre-split monorepo workflow (obilabs-platform
# .github/workflows/build-aegis.yml, dropped in 18f53f7 "drop extracted-aegis CI
# remnants" and never re-added here — this repo had no CI at all until now).
#
# Differences from the monorepo original, all because this is a standalone repo:
#   - build context is the repo root, Dockerfile is ./Dockerfile
#   - no workspace: @obilabs/* resolve from public npmjs, so no root
#     pnpm-lock.yaml / pnpm-workspace.yaml need to be in the context
#   - the Settings-landing-link gate moved to ci.yml, where it runs per-PR
#     instead of only on push-to-main (a release gate that only fires after
#     merge is a gate that already let the bug in)

on:
  push:
    branches: [main]
    # Release tags MUST build. Deliberately NO paths / paths-ignore filter:
    # in GitHub Actions a path filter applies to TAG pushes too, so tagging a
    # release on a commit that happened to touch only docs would silently
    # publish NOTHING — a missed release that looks exactly like success, which
    # is the worst failure mode this project has. Main pushes only move `edge`,
    # so the occasional wasted build on a docs commit is the cheap side of the
    # trade. (This file previously had a paths-ignore block; it was removed
    # when tag builds were added on 2026-08-17.)
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version tag override (e.g. 0.2.0). Defaults to package.json version.'
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # obilabs/aegis -> ghcr.io/obilabs/aegis

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          OVERRIDE="${{ github.event.inputs.version_override }}"
          VERSION="${OVERRIDE:-$PKG_VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # IMMUTABLE VERSION TAGS. Ported from obilabs-platform (#105) on
          # 2026-08-17 — this repo never received the policy when it was split
          # out, so every merge to main was REPUBLISHING `:latest` AND the
          # package.json version (`:0.1.0`), overwriting both. A tag that moves
          # is not a version: pinning AEGIS_VERSION=0.1.0 in a compose file
          # pinned nothing, it tracked main under a stable-looking name.
          #
          #   merge to main  -> edge, sha-<commit>   (nobody pins these)
          #   git tag v1.2.0 -> 1.2.0, 1.2, latest   (deployments pin these)
          #
          # `sha-*` is the only tag that is unambiguous when two builds finish
          # near-simultaneously; two main builds raced for `edge` 14 seconds
          # apart on 2026-08-17, which is why the e2e runbook pins sha-*.
          tags: |
            type=sha,prefix=sha-
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.AEGIS_PUBLIC_URL || 'https://aegis.agu.ca' }}
