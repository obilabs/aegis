name: E2E walk-through

# Builds the app image from the PR, starts a fresh compose stack exactly as a
# self-hoster would (env.example + the three required secrets), and walks the
# product in a real browser: setup token + wizard, users and roles, tickets and
# attachments, knowledge base, companies/contacts/assets, settings, and a stack
# restart. See e2e/README.md. Same script locally: bash e2e/run.sh
#
# Heavier than ci.yml (image build + full stack), so it runs on PRs that touch
# the app, the image or the suite, and on demand.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'middleware.ts'
      - 'instrumentation.ts'
      - 'database/**'
      - 'nginx/**'
      - 'scripts/seed-admin.mjs'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'docker-compose.yml'
      - 'env.example'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'next.config.js'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  walkthrough:
    name: Browser walk-through (fresh install)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Run walk-through
        env:
          CI: 'true'
        run: bash e2e/run.sh

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: e2e/artifacts
          if-no-files-found: ignore
          retention-days: 7
