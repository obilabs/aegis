name: CI

on:
  # NOTE: deliberately NO `branches:` filter here. That filter matches the
  # *base* branch, so `branches: [main]` silently skips CI on any stacked PR
  # (one based on another feature branch). That bit us on obilabs-platform#92 —
  # the only PR in a batch carrying runtime code was the one that got no
  # typecheck and no tests. Every PR gets gated here, whatever its base.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Type Check & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # Version intentionally omitted — pnpm reads it from package.json
        # `packageManager: pnpm@10.19.0`. Specifying both causes
        # ERR_PNPM_BAD_PM_VERSION when they don't match exactly.

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20 # matches the Dockerfile's node:20-alpine
          cache: pnpm

      - name: Install dependencies
        # @obilabs/* resolve from public npmjs — this is a standalone repo, no
        # workspace and no token needed.
        run: pnpm install --frozen-lockfile

      - name: UI primitive ratchet
        # CLAUDE.md has forbidden rolling your own <button> since 2026-06-09.
        # On 2026-08-20 the ticket detail page alone had 22 raw <button>, zero
        # <Button> and zero <Badge>; app/portal had 576 raw buttons in 84 files.
        # A rule that is only written down is not a rule.
        #
        # This is a ratchet, not a ban: scripts/ui-primitives-baseline.json
        # records today's per-file counts. A file may not exceed its count and no
        # new file may appear, so the debt can only shrink. Refresh the baseline
        # with `node scripts/check-ui-primitives.mjs --update` when you reduce it.
        run: node scripts/check-ui-primitives.mjs

      - name: Verify Settings landing links resolve
        # portal-nav-cleanup: every href in app/portal/settings/page.tsx that
        # starts with /portal/ MUST resolve to a real page.tsx on disk. Catches
        # the bug class where a tile is added or kept but the backing page never
        # exists. See openspec/specs/portal-nav-integrity/spec.md.
        #
        # Uses POSIX ERE rather than the `grep -oP ... \K` form this gate had in
        # the monorepo: -P is a GNU extension that isn't available in every grep
        # build, so the portable form is the safer gate.
        run: |
          set -euo pipefail
          settings_page="app/portal/settings/page.tsx"
          hrefs=$(grep -oE "href: *['\"]/portal[^'\"]+" "$settings_page" \
                    | sed -E "s/.*['\"]//; s/\?.*//" \
                    | sort -u)
          broken=$(echo "$hrefs" | while IFS= read -r path; do
                     [ -n "$path" ] || continue
                     test -f "app${path}/page.tsx" || echo "$path"
                   done)
          if [ -n "$broken" ]; then
            echo "::error file=${settings_page}::Settings landing has broken link(s):"
            echo "$broken" | while IFS= read -r p; do
              echo "::error file=${settings_page}::  ${p} → no page.tsx at app${p}/page.tsx"
            done
            echo "::error::Either remove the tile from the Settings landing or create the backing page. See openspec/specs/portal-nav-integrity/spec.md."
            exit 1
          fi
          echo "All Settings landing links resolve ($(echo "$hrefs" | wc -l) checked)."

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test

  database:
    name: Database contract (audit immutability)
    runs-on: ubuntu-latest
    # The audit trail's append-only guarantee is enforced by triggers, an ACL
    # and a hash chain — none of which a typecheck or a vitest can exercise.
    # It has to run against a real Postgres, on a schema built the way a fresh
    # install builds it, or "append-only" is back to being a claim.
    services:
      postgres:
        # pgvector, because init.sql declares `CREATE EXTENSION vector` and
        # four tables use the type. Pinned to the same major as production.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: aegis
      PGPASSWORD: aegis
      PGDATABASE: aegis
    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Build the schema the way a fresh install does
        # Mirrors docker-entrypoint.sh: init.sql first, then any migration not
        # already recorded in schema_migrations (init.sql pre-populates 088-097).
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f database/init.sql
          psql -v ON_ERROR_STOP=1 -q -c "CREATE TABLE IF NOT EXISTS schema_migrations (version TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW());"
          for migration in database/migrations/*.sql; do
            name="$(basename "$migration" .sql)"
            applied="$(psql -t -A -c "SELECT 1 FROM schema_migrations WHERE version = '$name';")"
            if [ "$applied" = "1" ]; then continue; fi
            echo "applying $name"
            psql -v ON_ERROR_STOP=1 -q -f "$migration"
            psql -q -c "INSERT INTO schema_migrations (version) VALUES ('$name');"
          done

      - name: Audit-log immutability + hash chain
        run: psql -v ON_ERROR_STOP=1 -f database/tests/audit-immutability.integration.test.sql
